[project]
name = "energywatch-ai"
version = "1.2.0"
description = "Multi-agent energy monitoring platform built with LangGraph"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/evaluation/run_eval.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E402"]
